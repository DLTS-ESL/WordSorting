
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetic Word Board</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f8f7ff;
  color: #414660;
}
header { text-align: center; padding: 14px; }
h1 { color: #7774b9; margin: 5px; font-size: clamp(26px,4vw,40px); }
header p { color: #8589a1; margin: 8px; }
.controls {
  margin: 0 14px 12px;
  padding: 14px;
  border-radius: 18px;
  background: white;
  border: 1px solid #e8e4fa;
}
textarea {
  width: 100%; height: 75px; padding: 12px;
  border: 2px solid #e4e0fa; border-radius: 13px;
  font: inherit;
}
.actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; }
button {
  border:0; border-radius:12px; padding:11px 15px;
  font-weight:bold; color:#514b80; background:#e4ddff;
  cursor:pointer;
}
#status { font-size:13px; color:#8589a1; margin-top:9px; }
#board {
  margin:0 14px 14px; position:relative;
  height:calc(100vh - 245px); min-height:400px;
  overflow:auto; border:2px dashed #dcd8f2;
  border-radius:20px; background-color:white;
  background-image:radial-gradient(#e7e3f5 1px,transparent 1px);
  background-size:22px 22px;
}
.word {
  position:absolute; display:flex; align-items:center; justify-content:center;
  min-height:62px; max-width:240px; padding:14px 20px;
  border:2px solid white; border-radius:18px;
  font-size:clamp(18px,2vw,25px); font-weight:bold;
  text-align:center; overflow-wrap:anywhere;
  user-select:none; touch-action:none; cursor:grab;
  box-shadow:0 3px 10px #41466014;
}
.word.dragging { z-index:10000!important; cursor:grabbing; box-shadow:0 8px 22px #41466030; }
.word.connected { border-color:#aaa2df; }
@media(max-width:600px) {
  .controls { margin:0 8px 10px; }
  #board { margin:0 8px 10px; height:65vh; }
  .word { max-width:180px; padding:11px 14px; }
}
@media print {
  .controls,header p { display:none; }
  #board { height:auto; min-height:500px; overflow:visible; }
}
</style>
</head>
<body>
<header>
  <h1>🌈 Magnetic Word Board</h1>
  <p>Drag the words together. Connected boxes move as a group.</p>
</header>
<section class="controls">
  <textarea id="wordInput" placeholder="Paste words, one per line...&#10;air&#10;pollution&#10;water&#10;energy"></textarea>
  <div class="actions">
    <button id="create">＋ Create Word Cards</button>
    <button id="arrange">Arrange Cards</button>
    <button id="reset">Clear Board</button>
    <button id="print">Print</button>
  </div>
  <div id="status">Bring box edges close together to snap them into a group.</div>
</section>
<main id="board"></main>

<script>
const board = document.getElementById("board");
const input = document.getElementById("wordInput");
const status = document.getElementById("status");

const colors = [
  "#FFE1EB","#DCEEFF","#FFF1BD","#DDF5E6",
  "#EEE3FF","#FFE7D6","#DDF5F4","#F7E2F8"
];

const SNAP = 20; // Magnetic attraction distance in pixels
let nextId = 1;
let topZ = 1;
let groupCounter = 1;
let drag = null;

function say(text) { status.textContent = text; }
function cards() { return [...board.querySelectorAll(".word")]; }

function newGroup() { return "g" + groupCounter++; }

function members(group) {
  return cards().filter(c => c.dataset.group === group);
}

function rect(c) {
  return {
    x: parseFloat(c.style.left)||0,
    y: parseFloat(c.style.top)||0,
    w: c.offsetWidth,
    h: c.offsetHeight
  };
}

// Find the magnetic edge connection between two boxes.
// Boxes snap when parallel edges are close and their
// perpendicular ranges overlap.
function findSnap(a, b) {
  const A = rect(a), B = rect(b);

  const overlapY = Math.min(A.y+A.h, B.y+B.h) -
                   Math.max(A.y, B.y);
  const overlapX = Math.min(A.x+A.w, B.x+B.w) -
                   Math.max(A.x, B.x);

  if (overlapY > 8) {
    if (Math.abs((A.x+A.w)-B.x) <= SNAP)
      return { direction:"left", distance:(A.x+A.w)-B.x };
    if (Math.abs((B.x+B.w)-A.x) <= SNAP)
      return { direction:"right", distance:(B.x+B.w)-A.x };
  }

  if (overlapX > 8) {
    if (Math.abs((A.y+A.h)-B.y) <= SNAP)
      return { direction:"top", distance:(A.y+A.h)-B.y };
    if (Math.abs((B.y+B.h)-A.y) <= SNAP)
      return { direction:"bottom", distance:(B.y+B.h)-A.y };
  }

  return null;
}

function setPosition(c,x,y) {
  c.style.left = Math.max(0,x) + "px";
  c.style.top = Math.max(0,y) + "px";
}

function makeCard(text,x,y) {
  const c = document.createElement("div");
  c.className = "word";
  c.textContent = text;
  c.dataset.id = nextId++;
  c.dataset.group = newGroup();
  c.style.background = colors[(Number(c.dataset.id)-1)%colors.length];
  c.style.left = x+"px";
  c.style.top = y+"px";
  c.style.zIndex = ++topZ;
  c.addEventListener("pointerdown",startDrag);
  board.appendChild(c);
  setPosition(c,Math.min(x,Math.max(0,board.clientWidth-c.offsetWidth)),y);
  return c;
}

function createCards() {
  const list = input.value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
  if (!list.length) return say("Paste some words first.");

  let x=15,y=15,rowHeight=0;
  list.forEach(text=>{
    const c=makeCard(text,x,y);
    if (x+c.offsetWidth>board.clientWidth-10) {
      x=15; y+=rowHeight+18; rowHeight=0;
      setPosition(c,x,y);
    }
    x+=c.offsetWidth+18;
    rowHeight=Math.max(rowHeight,c.offsetHeight);
  });
  input.value="";
  updateBoardHeight();
  say(list.length+" cards created. Bring edges close to snap together.");
}

function startDrag(e) {
  if (e.button!==undefined && e.button!==0) return;
  const c=e.currentTarget;
  const group=c.dataset.group;
  const r=board.getBoundingClientRect();

  drag={
    card:c, group, pointerId:e.pointerId,
    startX:e.clientX-r.left+board.scrollLeft,
    startY:e.clientY-r.top+board.scrollTop,
    items:members(group).map(m=>({
      card:m,x:parseFloat(m.style.left)||0,
      y:parseFloat(m.style.top)||0
    })),
    moved:false
  };

  drag.items.forEach(item=>{
    item.card.classList.add("dragging");
    item.card.style.zIndex=++topZ;
  });

  c.setPointerCapture(e.pointerId);
  c.addEventListener("pointermove",moveDrag);
  c.addEventListener("pointerup",endDrag);
  c.addEventListener("pointercancel",endDrag);
  e.preventDefault();
}

function moveDrag(e) {
  if (!drag || e.pointerId!==drag.pointerId) return;
  const r=board.getBoundingClientRect();
  const x=e.clientX-r.left+board.scrollLeft;
  const y=e.clientY-r.top+board.scrollTop;
  const dx=x-drag.startX, dy=y-drag.startY;

  if (Math.abs(dx)+Math.abs(dy)>2) drag.moved=true;

  drag.items.forEach(item=>setPosition(
    item.card,item.x+dx,item.y+dy
  ));
}

// After releasing, detach cards that were pulled away from
// their former group, then snap to the closest eligible group.
function endDrag(e) {
  if (!drag || e.pointerId!==drag.pointerId) return;

  const current=drag;
  const moving=current.items.map(i=>i.card);

  current.card.removeEventListener("pointermove",moveDrag);
  current.card.removeEventListener("pointerup",endDrag);
  current.card.removeEventListener("pointercancel",endDrag);
  cards().forEach(c=>c.classList.remove("dragging"));

  if (current.moved) {
    // Split moving members from the old group if they no longer
    // touch any member left behind.
    const oldMembers=members(current.group).filter(c=>!moving.includes(c));

    if (oldMembers.length) {
      const remainingGroups=new Map();
      moving.forEach(c=>{
        if (!oldMembers.some(o=>findSnap(c,o))) {
          c.dataset.group=newGroup();
        }
      });
    }

    // Repeatedly snap to nearby cards in other groups.
    let changed=true, safety=0;
    while(changed && safety++<100) {
      changed=false;
      let best=null, bestDistance=Infinity;

      const all=cards();
      for (const a of moving) {
        for (const b of all) {
          if (moving.includes(b)) continue;
          const snap=findSnap(a,b);
          if (snap && a.dataset.group!==b.dataset.group &&
              Math.abs(snap.distance)<bestDistance) {
            best={a,b,snap};
            bestDistance=Math.abs(snap.distance);
          }
        }
      }

      if (best) {
        applySnap(best.a,best.b,best.snap);
        changed=true;
      }
    }
  }

  drag=null;
  updateConnections();
  updateBoardHeight();
  say("Ready! Drag connected boxes away to separate them.");
}

function applySnap(a,b,snap) {
  const A=rect(a), B=rect(b);
  let dx=0,dy=0;

  if (snap.direction==="left") dx=(B.x-(A.x+A.w));
  if (snap.direction==="right") dx=(B.x+B.w-A.x);
  if (snap.direction==="top") dy=(B.y-(A.y+A.h));
  if (snap.direction==="bottom") dy=(B.y+B.h-A.y);

  // Move the dropped group's members by the same amount,
  // aligning the two card edges exactly.
  const movingGroup=a.dataset.group;
  members(movingGroup).forEach(c=>{
    setPosition(c,(parseFloat(c.style.left)||0)+dx,
                  (parseFloat(c.style.top)||0)+dy);
  });

  const oldGroup=b.dataset.group;
  members(oldGroup).forEach(c=>c.dataset.group=movingGroup);
}

function updateConnections() {
  cards().forEach(c=>c.classList.remove("connected"));

  // Mark all cards in groups with more than one member.
  const groupIds=[...new Set(cards().map(c=>c.dataset.group))];
  groupIds.forEach(id=>{
    const list=members(id);
    if (list.length>1) list.forEach(c=>c.classList.add("connected"));
  });
}

function updateBoardHeight() {
  let bottom=0;
  cards().forEach(c=>{
    bottom=Math.max(bottom,(parseFloat(c.style.top)||0)+c.offsetHeight+30);
  });
  board.style.height=Math.max(window.innerHeight*.62,bottom)+"px";
}

document.getElementById("create").onclick=createCards;
input.addEventListener("keydown",e=>{
  if ((e.ctrlKey||e.metaKey)&&e.key==="Enter") createCards();
});

document.getElementById("arrange").onclick=()=>{
  let x=15,y=15,rowHeight=0;
  cards().forEach(c=>{
    if(x+c.offsetWidth>board.clientWidth-10){
      x=15; y+=rowHeight+18; rowHeight=0;
    }
    setPosition(c,x,y);
    x+=c.offsetWidth+18;
    rowHeight=Math.max(rowHeight,c.offsetHeight);
  });
  cards().forEach(c=>c.dataset.group=newGroup());
  updateConnections();
  updateBoardHeight();
  say("Cards arranged. Drag them together to make groups.");
};

document.getElementById("reset").onclick=()=>{
  board.replaceChildren();
  nextId=1; groupCounter=1; topZ=1;
  board.style.height="";
  say("Board cleared. Paste a new list.");
};

document.getElementById("print").onclick=()=>window.print();
window.addEventListener("resize",updateBoardHeight);
</script>
</body>
</html>

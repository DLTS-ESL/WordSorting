
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESL Vocabulary Word Board</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f8f7fc;
    color: #333;
  }

  h1 {
    text-align: center;
    color: #66558f;
    margin: 5px 0 10px;
  }

  .subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 20px;
  }

  .controls {
    max-width: 1100px;
    margin: 0 auto 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  textarea {
    width: 100%;
    min-height: 110px;
    padding: 14px;
    border: 2px solid #ddd5f2;
    border-radius: 14px;
    font-size: 16px;
    resize: vertical;
    font-family: inherit;
    background: white;
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  button {
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #dcd2fa;
    color: #44346e;
  }

  button:hover {
    filter: brightness(0.97);
  }

  .create-btn {
    background: #bdebdc;
    color: #245b4a;
  }

  .clear-btn {
    background: #ffd9dc;
    color: #8b3d48;
  }

  .board {
    position: relative;
    width: 100%;
    min-height: 650px;
    border: 2px dashed #d8d0e8;
    border-radius: 18px;
    background-color: #fff;
    background-image: radial-gradient(#e9e3f3 1px, transparent 1px);
    background-size: 22px 22px;
    overflow: hidden;
  }

  .word-card {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 110px;
    min-height: 58px;
    max-width: 240px;
    padding: 14px 18px;
    border-radius: 15px;
    border: 2px solid rgba(80, 65, 110, 0.10);
    box-shadow: 0 3px 7px rgba(50, 40, 70, 0.12);
    font-size: 17px;
    font-weight: bold;
    text-align: center;
    overflow-wrap: anywhere;
    cursor: grab;
    user-select: none;
    touch-action: none;
    transform: none;
  }

  .word-card:active {
    cursor: grabbing;
  }

  .word-card.dragging {
    z-index: 9999;
    box-shadow: 0 8px 20px rgba(50, 40, 70, 0.22);
  }

  .hint {
    margin: 12px 0 0;
    text-align: center;
    color: #777;
    font-size: 14px;
  }

  @media print {
    body {
      background: white;
      padding: 0;
    }

    h1, .subtitle, .controls, .hint {
      display: none;
    }

    .board {
      min-height: 95vh;
      border: 1px solid #ccc;
      background-image: none;
    }

    .word-card {
      box-shadow: none;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>

<body>
  <h1>ESL Vocabulary Word Board</h1>
  <p class="subtitle">Create your cards, then drag the words to group them.</p>

  <div class="controls">
    <textarea id="wordInput" placeholder="Paste your vocabulary words here, one word or phrase per line.

Example:
effect
waste
wind energy
drought
air pollution
electricity"></textarea>

    <div class="buttons">
      <button class="create-btn" onclick="createCards()">Create Word Cards</button>
      <button onclick="shuffleCards()">Arrange Cards</button>
      <button class="clear-btn" onclick="clearBoard()">Clear Board</button>
      <button onclick="window.print()">Print Board</button>
    </div>
  </div>

  <div id="board" class="board"></div>

  <p class="hint">
    Tip: Drag each card freely. Place related words close together to create your own groups.
  </p>

<script>
  const board = document.getElementById("board");
  const wordInput = document.getElementById("wordInput");

  const pastelColors = [
    "#FCE1E4",
    "#DFF3E4",
    "#DDEBFA",
    "#FFF0C7",
    "#EADFFA",
    "#FFE4CC",
    "#D8F3F0",
    "#F5DFF0",
    "#E8EDC8",
    "#E3E0FF"
  ];

  let cardCount = 0;

  function createCards() {
    const words = wordInput.value
      .split(/\n/)
      .map(word => word.trim())
      .filter(word => word.length > 0);

    if (words.length === 0) {
      alert("Please paste some vocabulary words first.");
      return;
    }

    board.innerHTML = "";
    cardCount = 0;

    words.forEach((word, index) => {
      const card = document.createElement("div");
      card.className = "word-card";
      card.textContent = word;
      card.style.backgroundColor =
        pastelColors[index % pastelColors.length];

      board.appendChild(card);

      const column = index % 5;
      const row = Math.floor(index / 5);

      card.style.left = (20 + column * 200) + "px";
      card.style.top = (20 + row * 95) + "px";

      makeDraggable(card);
      cardCount++;
    });

    fitCardsInsideBoard();
  }

  function makeDraggable(card) {
    let startX = 0;
    let startY = 0;
    let originalLeft = 0;
    let originalTop = 0;

    card.addEventListener("pointerdown", function(event) {
      if (event.button !== undefined && event.button !== 0) return;

      event.preventDefault();

      const boardRect = board.getBoundingClientRect();
      const cardRect = card.getBoundingClientRect();

      startX = event.clientX;
      startY = event.clientY;

      originalLeft = cardRect.left - boardRect.left;
      originalTop = cardRect.top - boardRect.top;

      card.classList.add("dragging");
      card.style.zIndex = 1000;

      card.setPointerCapture(event.pointerId);
    });

    card.addEventListener("pointermove", function(event) {
      if (!card.classList.contains("dragging")) return;

      const boardRect = board.getBoundingClientRect();

      let newLeft = originalLeft + event.clientX - startX;
      let newTop = originalTop + event.clientY - startY;

      const maxLeft = Math.max(0, board.clientWidth - card.offsetWidth);
      const maxTop = Math.max(0, board.clientHeight - card.offsetHeight);

      newLeft = Math.max(0, Math.min(newLeft, maxLeft));
      newTop = Math.max(0, Math.min(newTop, maxTop));

      card.style.left = newLeft + "px";
      card.style.top = newTop + "px";
    });

    function stopDragging() {
      if (!card.classList.contains("dragging")) return;

      card.classList.remove("dragging");
      card.style.zIndex = "";
    }

    card.addEventListener("pointerup", stopDragging);
    card.addEventListener("pointercancel", stopDragging);
  }

  function shuffleCards() {
    const cards = Array.from(board.querySelectorAll(".word-card"));
    const gap = 15;
    let x = gap;
    let y = gap;
    let rowHeight = 0;

    cards.forEach(card => {
      const cardWidth = card.offsetWidth;
      const cardHeight = card.offsetHeight;

      if (x + cardWidth > board.clientWidth - gap) {
        x = gap;
        y += rowHeight + gap;
        rowHeight = 0;
      }

      card.style.left = x + "px";
      card.style.top = y + "px";

      x += cardWidth + gap;
      rowHeight = Math.max(rowHeight, cardHeight);
    });

    fitCardsInsideBoard();
  }

  function fitCardsInsideBoard() {
    const cards = Array.from(board.querySelectorAll(".word-card"));
    let lowestPoint = 650;

    cards.forEach(card => {
      const bottom = parseFloat(card.style.top || 0) + card.offsetHeight;
      lowestPoint = Math.max(lowestPoint, bottom + 30);
    });

    board.style.minHeight = lowestPoint + "px";
  }

  function clearBoard() {
    board.innerHTML = "";
    wordInput.value = "";
    board.style.minHeight = "650px";
    cardCount = 0;
  }

  window.addEventListener("resize", fitCardsInsideBoard);
</script>
</body>
</html>

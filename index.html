
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pastel Word Cards</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  font-family: Arial, sans-serif;
  background: #f8f7ff;
  color: #414660;
}

h1 {
  text-align: center;
  font-size: clamp(28px, 4vw, 44px);
  color: #7774b9;
  margin: 8px 0;
}

p {
  text-align: center;
  color: #888ba4;
  margin-bottom: 24px;
}

textarea {
  width: 100%;
  min-height: 110px;
  padding: 16px;
  border: 2px solid #e4e0fa;
  border-radius: 18px;
  font-size: 17px;
  resize: vertical;
  background: white;
  color: #414660;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 12px 0 24px;
}

button {
  padding: 13px 20px;
  border: none;
  border-radius: 14px;
  background: #e4ddff;
  color: #514b80;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover { filter: brightness(.97); }

#wordCount {
  align-self: center;
  margin-left: auto;
  color: #8589a1;
}

#wordBoard {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: 16px;
}

.word {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 75px;
  padding: 18px 25px;
  border-radius: 22px;
  border: 3px solid white;
  box-shadow: 0 4px 12px #55557712;
  font-size: clamp(19px, 2.2vw, 28px);
  font-weight: bold;
  text-align: center;
  overflow-wrap: anywhere;
  max-width: 100%;
}

@media (max-width: 600px) {
  body { padding: 14px; }
  #wordCount { width: 100%; margin-left: 0; }
  .word { min-height: 60px; padding: 14px 18px; }
}

@media print {
  body { background: white; }
  textarea, .toolbar, p { display: none; }
  .word { break-inside: avoid; }
}
</style>
</head>

<body>

<h1>🌈 Word Cards</h1>
<p>Paste your vocabulary and create your colorful word board!</p>

<textarea id="inputWords"
placeholder="Paste your words here, one word per line...

pollution
energy
flood
recycle
natural resources"></textarea>

<div class="toolbar">
  <button onclick="createCards()">✨ Create Word Cards</button>
  <button onclick="document.getElementById('inputWords').value=''">
    Clear Text
  </button>
  <button onclick="clearCards()">Clear Board</button>
  <button onclick="window.print()">Print</button>
  <span id="wordCount">0 words</span>
</div>

<div id="wordBoard"></div>

<script>
const colors = [
  "#FFE1EB",
  "#DCEEFF",
  "#FFF1BD",
  "#DDF5E6",
  "#EEE3FF",
  "#FFE7D6",
  "#DDF5F4",
  "#F7E2F8"
];

function createCards() {
  const input = document.getElementById("inputWords").value;

  // Accept one word per line, or comma/semicolon-separated lists.
  const items = input
    .split(/[\n,;]+/)
    .map(word => word.trim())
    .filter(word => word.length > 0);

  const board = document.getElementById("wordBoard");

  items.forEach(word => {
    const card = document.createElement("div");
    card.className = "word";
    card.textContent = word;
    card.style.backgroundColor =
      colors[board.children.length % colors.length];

    board.appendChild(card);
  });

  document.getElementById("wordCount").textContent =
    board.children.length + " words";
}

function clearCards() {
  document.getElementById("wordBoard").replaceChildren();
  document.getElementById("wordCount").textContent = "0 words";
}
</script>

</body>
</html>
